<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="论文投稿状态总览：把所有稿件集中到一个页面，数据只保存在本机浏览器。">
<meta name="color-scheme" content="light">
<title>投稿状态总览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F6BD8'/%3E%3Cpath d='M9 7h10l4 4v14H9z' fill='%23fff'/%3E%3Cpath d='M12 17l3 3 5-6' stroke='%232F6BD8' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ========== 基础变量 ========== */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --text: #1F2328;
  --text-2: #5B616B;
  --border: #E3E6EB;
  --input-border: #CDD2DA;
  --primary: #2F6BD8;
  --primary-hover: #2459BA;
  --primary-soft: #EAF1FC;
  --danger: #C8373A;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --tap: 44px; /* 手机上可点区域的最小高度 */
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ========== 顶部栏 ========== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  padding-top: env(safe-area-inset-top);
  background: rgba(255, 255, 255, .94);
  border-bottom: 1px solid var(--border);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.topbar-inner {
  max-width: 880px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.app-title { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; }

/* ========== 按钮 ========== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap);
  padding: 0 16px;
  border: 1px solid var(--input-border);
  border-radius: 10px;
  background: #fff;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.btn:hover { background: #F6F7F9; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: #AD2C2F; border-color: #AD2C2F; }
.btn-text {
  min-width: var(--tap);
  padding: 0 12px;
  border-color: transparent;
  background: transparent;
  color: var(--text-2);
  font-weight: 500;
}
.btn-text:hover { background: #EEF0F3; color: var(--text); }
.btn-text.is-danger:hover { background: #FCEAEA; color: var(--danger); }
.btn-icon {
  width: var(--tap);
  height: var(--tap);
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-2);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}
.btn-icon:hover { background: #EEF0F3; }

/* ========== 主体与提示条 ========== */
.container {
  flex: 1;
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 4px 16px 24px;
}
.banner {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 8px 8px 8px 14px;
  border: 1px solid #F3D3AE;
  border-radius: 10px;
  background: #FDF3E7;
  color: #7A3E06;
  font-size: 14px;
}
.banner p { flex: 1; margin: 0; overflow-wrap: anywhere; }
.banner .btn-text { color: #7A3E06; flex-shrink: 0; }

/* ========== 论文卡片 ========== */
.paper-list {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.paper-card {
  /* 屏幕外的卡片跳过排版和绘制，500 条时搜索、筛选、排序也不卡 */
  content-visibility: auto;
  contain-intrinsic-size: auto 132px;
  padding: 10px 12px 10px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.card-top { display: flex; align-items: flex-start; gap: 8px; }
.title-btn {
  flex: 1;
  min-width: 0;
  min-height: var(--tap);
  padding: 6px 0;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}
.title-text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; /* 标题最多显示 2 行 */
  line-clamp: 2;
  overflow: hidden;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  overflow-wrap: anywhere; /* 没有空格的长英文串也能换行 */
  word-break: break-word;
}
.paper-card.expanded .title-text { display: block; -webkit-line-clamp: unset; line-clamp: none; }
.tag-sample {
  flex-shrink: 0;
  margin-top: 11px;
  padding: 1px 8px;
  border-radius: 6px;
  background: #EEF0F3;
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
}
.card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 14px;
  color: var(--text-2);
  font-size: 14px;
}
.card-meta > * { min-width: 0; overflow-wrap: anywhere; }
.source-pill {
  padding: 0 8px;
  border: 1px solid var(--input-border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
}
.meta-item.is-empty { color: #767C85; }
.card-status {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  margin-top: 8px;
}

/* 状态下拉：颜色来自内联变量 --c（主色）、--tint（浅底）、--ink（文字色） */
.status-wrap { position: relative; display: inline-flex; }
.status-wrap::before {
  content: "";
  position: absolute;
  left: 13px;
  top: 50%;
  width: 8px;
  height: 8px;
  margin-top: -4px;
  border-radius: 50%;
  background: var(--c);
  pointer-events: none;
}
.status-wrap::after {
  content: "";
  position: absolute;
  right: 13px;
  top: 50%;
  width: 6px;
  height: 6px;
  margin-top: -5px;
  border-right: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  transform: rotate(45deg);
  pointer-events: none;
}
.status-select {
  -webkit-appearance: none;
  appearance: none;
  min-height: var(--tap);
  padding: 0 32px 0 28px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--tint);
  color: var(--ink);
  font-size: 16px; /* 不小于 16px，避免 iPhone 自动放大 */
  font-weight: 600;
  cursor: pointer;
}
.status-select:hover { border-color: var(--c); }
.status-select option { color: var(--text); background: #fff; font-weight: 400; }

/* 等待天数徽章：0–30 天正常 / 31–90 天橙色 / 91 天起红色 / 已出结果不着色
 * 橙、红两档用实色底 + 图标，和状态胶囊的浅色底明显区分开，一眼能看出哪篇该催 */
.days {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}
.days-icon { width: 14px; height: 14px; flex-shrink: 0; }
.days-normal { background: #F0F2F5; color: #4B5563; }
.days-warn { background: #F28C28; color: #2B1600; font-weight: 700; padding-left: 8px; }
.days-danger { background: #D0312D; color: #FFFFFF; font-weight: 700; padding-left: 8px; }
.days-final { background: transparent; color: var(--text-2); font-weight: 500; box-shadow: inset 0 0 0 1px var(--border); }
.submitted { color: var(--text-2); font-size: 14px; white-space: nowrap; }
.card-actions { display: flex; gap: 2px; margin-left: auto; }
.row-break { display: none; }

/* 展开后的详情 */
.card-details {
  margin: 8px 0 4px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  color: var(--text-2);
  font-size: 14px;
  cursor: auto;
}
.card-details dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
.card-details dt { color: var(--text-2); }
.card-details dd { margin: 0; min-width: 0; color: var(--text); }
.note-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.note-empty { color: #767C85; }

/* ========== 空列表 ========== */
.empty-state { padding: 72px 16px; text-align: center; color: var(--text-2); }
.empty-state svg { width: 64px; height: 64px; color: #B8BEC7; }
.empty-title { margin: 12px 0 0; font-size: 16px; color: var(--text); }

/* ========== 页脚 ========== */
.footer {
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  color: var(--text-2);
  font-size: 13px;
  text-align: center;
}

/* ========== 弹窗 ========== */
.dialog {
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  padding: 0;
  border: 0;
  border-radius: 16px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 20px 48px rgba(15, 23, 42, .22);
}
.dialog[open] { display: flex; flex-direction: column; }
.dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dialog-form { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 10px 4px 20px;
}
.dialog-header h2 { margin: 0; font-size: 18px; }
.dialog-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px 16px; }
.dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
}
.dialog-small { width: min(420px, calc(100vw - 32px)); }
.dialog-small .dialog-header { padding: 18px 20px 4px; }
.dialog-small .dialog-footer { border-top: 0; padding-top: 4px; }
.confirm-message { margin: 4px 0 0; color: var(--text-2); overflow-wrap: anywhere; }

/* ========== 表单 ========== */
.field { min-width: 0; margin: 14px 0 0; padding: 0; border: 0; }
.field-label { display: block; margin: 0 0 6px; padding: 0; font-size: 14px; font-weight: 600; }
.req { margin-left: 2px; color: var(--danger); }
.input {
  display: block;
  width: 100%;
  min-height: var(--tap);
  padding: 9px 12px;
  border: 1px solid var(--input-border);
  border-radius: 8px;
  background: #fff;
  font-size: 16px; /* 不小于 16px，避免 iPhone 自动放大 */
  line-height: 1.5;
}
.input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary); }
textarea.input { resize: vertical; }
input[type="date"].input { -webkit-appearance: none; appearance: none; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
select.input { cursor: pointer; }
.field.invalid .input { border-color: var(--danger); }
.field-error { margin: 4px 0 0; color: var(--danger); font-size: 13px; }
.field-error:empty { display: none; }
.hint { margin: 4px 0 0; color: var(--text-2); font-size: 13px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.radio-group { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-chip { position: relative; }
.radio-chip input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.radio-chip span {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: 0 14px;
  border: 1px solid var(--input-border);
  border-radius: 8px;
  background: #fff;
}
.radio-chip input:checked + span {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: #1F4FA8;
  font-weight: 600;
}
.radio-chip input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.field.invalid .radio-chip span { border-color: var(--danger); }

/* ========== 轻提示 ========== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  z-index: 20;
  max-width: calc(100vw - 32px);
  padding: 10px 16px;
  border-radius: 10px;
  background: #1F2328;
  color: #fff;
  font-size: 14px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, .25);
  transform: translateX(-50%);
}

/* ========== 顶部栏右侧：更多菜单 ========== */
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.menu-wrap { position: relative; }
.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  z-index: 30;
  min-width: 260px;
  max-width: calc(100vw - 24px);
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 12px 32px rgba(15, 23, 42, .16);
}
.menu-item {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: var(--tap);
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  font-size: 15px;
  text-align: left;
  white-space: nowrap;
  cursor: pointer;
}
.menu-item:hover, .menu-item:focus-visible { background: #F1F3F6; outline: none; }
.menu-item:disabled { color: #9AA0A8; background: transparent; cursor: not-allowed; }
.menu-sub { margin-left: auto; padding-left: 16px; color: var(--text-2); font-size: 13px; }
.menu-item:disabled .menu-sub { color: #9AA0A8; }
.menu-sep { height: 1px; margin: 6px 4px; background: var(--border); }

/* ========== 工具栏：搜索、筛选、排序 ========== */
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-top: 12px;
}
.search-box { position: relative; flex: 1 1 220px; min-width: 0; }
.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  width: 18px;
  height: 18px;
  margin-top: -9px;
  color: #767C85;
  pointer-events: none;
}
.input.search-input { padding-left: 38px; padding-right: 44px; }
.search-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
.search-clear {
  position: absolute;
  right: 0;
  top: 0;
  width: var(--tap);
  height: var(--tap);
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.search-clear:hover { color: var(--text); }
.filter-toggle { display: none; }
.filter-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  margin-left: 6px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
}
.filter-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.filter-item { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 14px; white-space: nowrap; }
.filter-item .input { width: auto; min-width: 118px; color: var(--text); }
.result-bar { display: flex; align-items: center; gap: 4px; margin-top: 6px; color: var(--text-2); font-size: 14px; }
.btn-link {
  min-height: var(--tap);
  padding: 0 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-link:hover { background: var(--primary-soft); }
.no-match { padding: 56px 16px; text-align: center; color: var(--text-2); }
.no-match .btn { margin-top: 12px; }

/* ========== 从备份恢复 ========== */
.restore-summary { margin: 8px 0 0; font-size: 15px; }
.choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 8px;
  padding: 12px;
  border: 1px solid var(--input-border);
  border-radius: 10px;
  cursor: pointer;
}
.choice:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.choice input { flex-shrink: 0; width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--primary); }
.choice-title { display: block; font-weight: 600; }
.choice-desc { display: block; margin-top: 2px; color: var(--text-2); font-size: 13px; }

/* ========== 管理状态 ========== */
.section-title { margin: 18px 0 8px; font-size: 14px; font-weight: 700; }
.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 3px 10px 3px 9px;
  border-radius: 999px;
  background: var(--tint);
  color: var(--ink);
  font-size: 14px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.status-chip::before {
  content: "";
  flex-shrink: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
}
.custom-list { margin: 0; padding: 0; list-style: none; border: 1px solid var(--border); border-radius: 10px; }
.custom-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 10px;
  padding: 4px 4px 4px 12px;
  border-top: 1px solid var(--border);
}
.custom-row:first-child { border-top: 0; }
.custom-empty { padding: 12px; color: var(--text-2); font-size: 14px; }
.row-meta { color: var(--text-2); font-size: 13px; }
.tag-final { padding: 1px 6px; border-radius: 6px; background: #EEF0F3; color: var(--text-2); font-size: 12px; font-weight: 600; }
.row-actions { display: flex; margin-left: auto; }
.inline-error { margin: 8px 0 0; color: var(--danger); font-size: 13px; }
.inline-error:empty { display: none; }
.inline-ok { margin: 8px 0 0; color: #2B730B; font-size: 13px; }
.inline-ok:empty { display: none; }
.list-actions { margin-top: 12px; }
.status-editor {
  margin-top: 12px;
  padding: 2px 14px 14px;
  border: 1px solid var(--primary);
  border-radius: 12px;
  background: #FAFCFF;
}
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { position: relative; }
.swatch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.swatch span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--tap);
  height: var(--tap);
  border: 2px solid transparent;
  border-radius: 10px;
}
.swatch span::before { content: ""; width: 24px; height: 24px; border-radius: 50%; background: var(--c); }
.swatch input:checked + span { border-color: var(--text); }
.swatch input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: var(--tap); margin-top: 8px; cursor: pointer; }
.check-row input { flex-shrink: 0; width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
.editor-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

/* ========== 手机适配 ========== */
@media (max-width: 600px) {
  /* 添加/编辑、恢复、管理状态弹窗在手机上全屏显示 */
  .dialog.dialog-full {
    width: 100vw;
    max-width: 100vw;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    margin: 0;
    border-radius: 0;
  }
  .dialog-full .dialog-footer { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .dialog-full .dialog-footer .btn { flex: 1; }

  /* 工具栏：搜索框和「筛选」按钮一行，筛选排序收进折叠面板 */
  .toolbar { flex-wrap: wrap; }
  .search-box { flex: 1 1 0; }
  .filter-toggle { display: inline-flex; }
  .filter-panel {
    display: none;
    flex-basis: 100%;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
  }
  .filter-panel.open { display: flex; }
  .filter-item { justify-content: space-between; }
  .filter-item .input { flex: 0 1 68%; min-width: 0; }
  .topbar-actions .btn { padding: 0 12px; }
  /* 手机上菜单改为贴着屏幕左右两边显示，避免超出屏幕 */
  .menu {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 60px);
    left: 12px;
    right: 12px;
    min-width: 0;
    max-width: none;
  }
}
@media (max-width: 480px) {
  .field-row { grid-template-columns: 1fr; }
  .paper-card { padding: 8px 8px 8px 14px; }
  /* 手机上：状态和天数一行，投稿日期和操作按钮固定另起一行 */
  .card-status { row-gap: 2px; }
  .row-break { display: block; flex-basis: 100%; height: 0; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="app-title">投稿状态总览</h1>
    <div class="topbar-actions">
      <div class="menu-wrap">
        <button id="btn-more" class="btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">更多</button>
        <div id="more-menu" class="menu" role="menu" aria-label="更多操作" hidden>
          <button type="button" class="menu-item" role="menuitem" data-menu="export-xlsx">导出 Excel<span class="menu-sub" data-export-count></span></button>
          <button type="button" class="menu-item" role="menuitem" data-menu="export-csv">导出 CSV<span class="menu-sub" data-export-count></span></button>

<main class="container">
  <noscript><div class="banner"><p>请开启浏览器的 JavaScript 后再使用本工具。</p></div></noscript>
  <div id="banners" role="alert"></div>

  <!-- 工具栏：搜索、筛选、排序（有论文时才显示） -->

      </svg>
      <input id="search" class="input search-input" type="search" placeholder="搜索标题/期刊/稿号" aria-label="搜索标题、期刊/会议名、稿号" autocomplete="off" enterkeyhint="search">
      <button id="search-clear" class="search-clear" type="button" aria-label="清空搜索" hidden>×</button>

    <button id="btn-filter" class="btn filter-toggle" type="button" aria-expanded="false" aria-controls="filter-panel">筛选<span id="filter-count" class="filter-count" hidden></span></button>

      <label class="filter-item">状态<select id="filter-status" class="input"></select></label>
      <label class="filter-item">来源<select id="filter-source" class="input"></select></label>

      <path d="M24 32h18M24 40h18M24 48h10" stroke-linecap="round"/>

<footer class="footer">数据只保存在本机浏览器，不会上传到任何服务器。</footer>

<!-- 选择备份文件（隐藏，由「从备份恢复」触发） -->
<input id="restore-file" type="file" accept=".json,application/json" hidden>

<!-- 添加 / 编辑论文弹窗 -->
<dialog id="paper-dialog" class="dialog dialog-full" aria-labelledby="paper-dialog-title">
  <form id="paper-form" class="dialog-form" novalidate>
    <div class="dialog-header">
      <h2 id="paper-dialog-title">添加论文</h2>
      <button type="button" class="btn-icon" data-close aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <div class="field" data-field="title">
        <label class="field-label" for="f-title">论文标题<span class="req" aria-hidden="true">*</span></label>
        <textarea id="f-title" name="title" class="input" rows="2" required autocomplete="off"></textarea>
        <p class="field-error" id="e-title"></p>
      </div>

      <fieldset class="field" data-field="sourceType">
        <legend class="field-label">来源类型<span class="req" aria-hidden="true">*</span></legend>
        <div class="radio-group" id="f-source-group"></div>
        <p class="field-error" id="e-sourceType"></p>
      </fieldset>

      <div class="field" data-field="venue">
        <label class="field-label" for="f-venue">期刊/会议名</label>
        <input id="f-venue" name="venue" class="input" type="text" autocomplete="off" placeholder="选填，期刊或会议的全称">
      </div>

      <div class="field-row">
        <div class="field" data-field="manuscriptId">
          <label class="field-label" for="f-manuscriptId">稿号</label>

        </div>
        <div class="field" data-field="submittedDate">
          <label class="field-label" for="f-submittedDate">投稿日期<span class="req" aria-hidden="true">*</span></label>
          <input id="f-submittedDate" name="submittedDate" class="input" type="date" required>
          <p class="field-error" id="e-submittedDate"></p>
        </div>
      </div>

      <div class="field-row">
        <div class="field" data-field="status">
          <label class="field-label" for="f-status">当前状态<span class="req" aria-hidden="true">*</span></label>
          <select id="f-status" name="status" class="input"></select>
          <p class="field-error" id="e-status"></p>
        </div>
        <div class="field" data-field="statusChangedDate" id="changed-date-field" hidden>
          <label class="field-label" for="f-statusChangedDate">出结果日期<span class="req" aria-hidden="true">*</span></label>
          <input id="f-statusChangedDate" name="statusChangedDate" class="input" type="date">
          <p class="field-error" id="e-statusChangedDate"></p>
          <p class="hint">天数计算到这一天为止</p>
        </div>
      </div>

      <div class="field" data-field="note">
        <label class="field-label" for="f-note">备注</label>
        <textarea id="f-note" name="note" class="input" rows="3" placeholder="选填，例如审稿意见要点、催稿记录"></textarea>
      </div>
    </div>
    <div class="dialog-footer">
      <button type="button" class="btn" data-close>取消</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<!-- 从备份恢复 -->
<dialog id="restore-dialog" class="dialog dialog-full" aria-labelledby="restore-title">
  <form id="restore-form" class="dialog-form" novalidate>
    <div class="dialog-header">

            <span class="choice-title">合并</span>

        <label class="choice">
          <input type="radio" name="restoreMode" value="overwrite">

<!-- 管理状态 -->
<dialog id="status-dialog" class="dialog dialog-full" aria-labelledby="status-dialog-title">

    <h2 id="status-dialog-title">管理状态</h2>
    <button type="button" class="btn-icon" data-close aria-label="关闭">×</button>
  </div>
  <div class="dialog-body">
    <h3 class="section-title">预置状态（不能修改）</h3>
    <div id="preset-chips" class="chip-list"></div>

    <h3 class="section-title">自定义状态</h3>
    <ul id="custom-list" class="custom-list"></ul>
    <p id="status-list-error" class="inline-error" role="alert"></p>
    <p id="status-list-ok" class="inline-ok" role="status"></p>
    <div class="list-actions">
      <button id="btn-new-status" class="btn" type="button">＋ 新增状态</button>
    </div>

    <form id="status-editor" class="status-editor" novalidate hidden>
      <h3 class="section-title" id="status-editor-title">新增状态</h3>
      <div class="field" data-sfield="name">
        <label class="field-label" for="s-name">名称<span class="req" aria-hidden="true">*</span></label>
        <input id="s-name" class="input" type="text" autocomplete="off" placeholder="最多 10 个字，例如：等待编辑决定">

<!-- 通用确认弹窗（不用浏览器自带的确认框，保证按钮文字是中文） -->
<dialog id="confirm-dialog" class="dialog dialog-small" aria-labelledby="confirm-title" aria-describedby="confirm-message">

  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';
(function () {
  /* =====================================================================
   * 一、常量
   * ===================================================================== */
  var STORAGE_KEY = 'pst.data.v1';   // localStorage 数据键名（版本号记在数据内部的 schemaVersion）
  var PREFS_KEY = 'pst.prefs.v1';    // 界面偏好（目前只记排序方式）
  var SCHEMA_VERSION = 2;            // 数据版本：1 = Stage 1；2 = 新增自定义状态
  var APP_ID = 'paper-submission-tracker';
  var MIN_DATE = '1990-01-01';       // 投稿日期下限，防止年份手误
  var WARN_DAYS = 30;                // 超过 30 天标橙
  var DANGER_DAYS = 90;              // 超过 90 天标红
  var DAY_MS = 86400000;
  var MAX_CUSTOM = 20;               // 自定义状态上限
  var MAX_STATUS_NAME = 10;          // 状态名称最多 10 个字
  var MAX_IMPORT_BYTES = 5 * 1024 * 1024;  // 备份文件大小上限 5 MB

  // 预置投稿状态（全版本统一，颜色固定）。en 为英文名，只在程序内部使用
  var PRESET_STATUSES = [
    { id: 'submitted',      name: '已投稿', en: 'Submitted',      color: '#4A90D9', ink: '#235C9E', final: false },
    { id: 'under_review',   name: '审稿中', en: 'Under Review',   color: '#E6A23C', ink: '#8A5A0F', final: false },
    { id: 'major_revision', name: '大修',   en: 'Major Revision', color: '#E67E22', ink: '#9A4A08', final: false },
    { id: 'minor_revision', name: '小修',   en: 'Minor Revision', color: '#7CB342', ink: '#44701A', final: false },
    { id: 'accepted',       name: '已接收', en: 'Accepted',       color: '#52C41A', ink: '#2B730B', final: true },
    { id: 'rejected',       name: '被拒',   en: 'Rejected',       color: '#EA6668', ink: '#B02A2D', final: true },
    { id: 'withdrawn',      name: '已撤稿', en: 'Withdrawn',      color: '#909399', ink: '#55585E', final: true }
  ];
  var PRESET_IDS = {};
  PRESET_STATUSES.forEach(function (s) { PRESET_IDS[s.id] = true; });

  // 自定义状态可选的 8 种颜色（ink 为文字色，已校验在浅色底上的对比度 ≥ 4.5）
  var PALETTE = [
    { name: '紫色',   color: '#8B5CF6', ink: '#5B2FC9' },
    { name: '靛蓝',   color: '#6366F1', ink: '#3F3FC0' },
    { name: '青绿',   color: '#14B8A6', ink: '#0B6B61' },
    { name: '天蓝',   color: '#0EA5E9', ink: '#076590' },
    { name: '玫红',   color: '#EC4899', ink: '#A51D5E' },
    { name: '棕色',   color: '#B7791F', ink: '#7A4E10' },
    { name: '石板灰', color: '#64748B', ink: '#3E4A5B' },
    { name: '橄榄绿', color: '#84A63A', ink: '#4A6118' }
  ];

  // 读到无法识别的状态时（例如状态已在其他页面被删除）使用的兜底样式
  var UNKNOWN_STATUS = { id: '', name: '未知状态', color: '#909399', ink: '#55585E', final: false };

  // 来源类型
  var SOURCES = [
    { id: 'elsevier',   name: 'Elsevier' },
    { id: 'ieee',       name: 'IEEE' },
    { id: 'conference', name: '会议' },
    { id: 'other',      name: '其他期刊' }
  ];

  // 排序方式
  var SORTS = [
    { id: 'submitted_desc', name: '投稿日期：新→旧' },
    { id: 'submitted_asc',  name: '投稿日期：旧→新' },
    { id: 'wait_desc',      name: '等待天数：长→短' },
    { id: 'wait_asc',       name: '等待天数：短→长' }
  ];

  // 导出表格的列
  var EXPORT_HEADERS = ['标题', '来源', '期刊/会议', '稿号', '投稿日期', '当前状态', '等待天数', '是否已出结果', '状态变更日期', '备注'];

  /* =====================================================================
   * 二、日期工具（全部按本机日历日计算，不做 UTC 换算）
   * ===================================================================== */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // 本机当天日期 YYYY-MM-DD。不能用 toISOString()，否则北京时间早上 8 点前会算成昨天
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  // 解析 YYYY-MM-DD，返回该日历日对应的 UTC 毫秒数（只用来算天数差）；非法日期返回 null
  function parseYMD(s) {
    if (typeof s !== 'string') return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var t = Date.UTC(y, mo - 1, d);
    var dt = new Date(t);
    // 反查一遍，过滤 2026-02-30 这类不存在的日期
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
    return t;
  }

  // 两个日期之间相差的天数（to - from）
  function daysBetween(from, to) {
    return Math.round((parseYMD(to) - parseYMD(from)) / DAY_MS);
  }

  // 日期加减天数
  function addDays(ymd, n) {
    var dt = new Date(parseYMD(ymd) + n * DAY_MS);
    return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth() + 1) + '-' + pad2(dt.getUTCDate());
  }

  // ISO 时间戳转成本机日期
  function localDateOf(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  /* =====================================================================
   * 三、通用小工具
   * ===================================================================== */
  function sourceName(id) {
    for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].id === id) return SOURCES[i].name;
    return '其他期刊';
  }

  function hexToRgba(hex, alpha) {
    var h = hex.replace('#', '');
    return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' +
      parseInt(h.slice(4, 6), 16) + ',' + alpha + ')';
  }

  // 生成唯一编号，保证同一天投稿的多篇不会互相覆盖
  function newId() {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    } catch (e) { /* 不支持时走下面的兜底 */ }
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  // 按字符截断（emoji 不会被截成乱码）
  function truncate(text, max) {
    var chars = Array.from(text || '');
    return chars.length > max ? chars.slice(0, max).join('') + '…' : chars.join('');
  }

  // 统一大小写和全角半角，用于搜索和判断重名
  function normalizeText(s) {
    var str = String(s == null ? '' : s);
    try { str = str.normalize('NFKC'); } catch (e) { /* 老浏览器不支持时直接用原文 */ }
    return str.toLowerCase();
  }
  function nameKey(s) { return normalizeText(s).trim(); }

  // 创建元素。文字一律用 textContent 写入，用户输入的 <script>、引号等只会原样显示
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function setStatusVars(node, st) {
    node.style.setProperty('--c', st.color);
    node.style.setProperty('--ink', st.ink);
    node.style.setProperty('--tint', hexToRgba(st.color, 0.14));
  }

  /* =====================================================================
   * 四、状态（预置 + 自定义）
   * ===================================================================== */
  var statusIndex = {};   // 状态编号 → 状态

  function paletteOf(color) {
    var c = String(color || '').toUpperCase();
    for (var i = 0; i < PALETTE.length; i++) if (PALETTE[i].color === c) return PALETTE[i];
    return null;
  }

  function customStatuses() {
    return (state.data && state.data.customStatuses) || [];
  }

  // 自定义状态补上显示用的文字色
  function decorateCustom(s) {
    var pal = paletteOf(s.color) || PALETTE[6];
    return { id: s.id, name: s.name, color: pal.color, ink: pal.ink, final: !!s.final, custom: true };
  }

  function rebuildStatusIndex() {
    statusIndex = {};
    PRESET_STATUSES.forEach(function (s) { statusIndex[s.id] = s; });
    customStatuses().forEach(function (s) { statusIndex[s.id] = decorateCustom(s); });
  }

  function getStatus(id) { return statusIndex[id] || UNKNOWN_STATUS; }

  function statusLabel(id) {
    return statusIndex[id] ? statusIndex[id].name : '未知状态（' + id + '）';
  }

  // 整理自定义状态列表：去掉编号或名称冲突的、颜色不在调色板里的改成默认色
  function normalizeCustomStatuses(list) {
    var out = [];
    var ids = {};
    var names = {};
    PRESET_STATUSES.forEach(function (s) { ids[s.id] = true; names[nameKey(s.name)] = true; });
    names[nameKey(UNKNOWN_STATUS.name)] = true;
    (Array.isArray(list) ? list : []).forEach(function (s) {
      if (!s || typeof s !== 'object' || out.length >= MAX_CUSTOM) return;
      var id = typeof s.id === 'string' ? s.id : '';
      var name = typeof s.name === 'string' ? s.name.trim() : '';
      if (!id || ids[id] || !name || names[nameKey(name)]) return;
      var pal = paletteOf(s.color);
      out.push({ id: id, name: name, color: pal ? pal.color : PALETTE[0].color, final: s.final === true });
      ids[id] = true;
      names[nameKey(name)] = true;
    });
    return out;
  }

  // 填充状态下拉：预置状态在前，自定义状态放进「自定义状态」分组
  function fillStatusOptions(select, current, withAll) {
    select.textContent = '';
    if (withAll) {
      var all = el('option', null, '全部状态');
      all.value = '';
      select.append(all);
    }
    PRESET_STATUSES.forEach(function (s) {
      var opt = el('option', null, s.name);
      opt.value = s.id;
      select.append(opt);
    });
    var customs = customStatuses();
    if (customs.length) {
      var group = document.createElement('optgroup');
      group.label = '自定义状态';
      customs.forEach(function (s) {
        var opt = el('option', null, s.name);
        opt.value = s.id;
        group.append(opt);
      });
      select.append(group);
    }
    // 无法识别的状态也保留一个选项，避免被悄悄改掉
    if (!withAll && current && !statusIndex[current]) {
      var unknown = el('option', null, '未知状态（' + current + '）');
      unknown.value = current;
      select.append(unknown);
    }
    select.value = withAll ? (current || '') : (current || 'submitted');
  }

  /* =====================================================================
   * 五、等待天数
   * ===================================================================== */
  // 返回 { level, days, text, tip }；level 为 normal / warn / danger / final；days 可能为 null
  function getWaitInfo(p, today) {
    if (parseYMD(p.submittedDate) === null) {
      return { level: 'warn', days: null, text: '投稿日期无效', tip: '请点「编辑」重新选择投稿日期' };
    }
    var st = getStatus(p.status);
    if (st.final) {
      // 已出结果：天数停在出结果那天
      var end = parseYMD(p.statusChangedDate) !== null ? p.statusChangedDate : today;
      var total = Math.max(0, daysBetween(p.submittedDate, end));
      return { level: 'final', days: total, text: '历时 ' + total + ' 天', tip: '从投稿到出结果共 ' + total + ' 天' };
    }
    var days = daysBetween(p.submittedDate, today);
    if (days < 0) {
      return { level: 'warn', days: days, text: '投稿日期晚于今天', tip: '请检查投稿日期，或电脑的系统日期是否正确' };
    }
    if (days > DANGER_DAYS) {
      return { level: 'danger', days: days, text: '已等待 ' + days + ' 天', tip: '已超过 90 天，可以考虑发邮件询问进度' };
    }
    if (days > WARN_DAYS) {
      return { level: 'warn', days: days, text: '已等待 ' + days + ' 天', tip: '等待时间偏长（31–90 天）' };
    }
    return { level: 'normal', days: days, text: '已等待 ' + days + ' 天', tip: '等待时间正常（30 天以内）' };
  }

  /* =====================================================================
   * 六、本地存储
   * ===================================================================== */
  var store = {
    available: false,

    // 检测浏览器是否允许写入（无痕模式、禁用网站数据时可能不允许）
    init: function () {
      try {
        var k = 'pst.__probe__';
        window.localStorage.setItem(k, '1');
        window.localStorage.removeItem(k);
        this.available = true;
      } catch (e) {
        this.available = false;
      }
    },

    readRaw: function () {
      try { return window.localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    },

    write: function (data) {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (e) {
        return false;
      }
    },

    // 把读不懂的原始数据另存一份，返回备份键名；失败返回 null
    backup: function (raw) {
      var key = STORAGE_KEY + '.corrupt.' + Date.now();
      try {
        window.localStorage.setItem(key, raw);
        return key;
      } catch (e) {
        return null;
      }
    }
  };

  // 界面偏好（只是方便，读写失败不影响使用）
  var prefs = {
    load: function () {
      try {
        var p = JSON.parse(window.localStorage.getItem(PREFS_KEY) || '{}');
        return p && typeof p === 'object' ? p : {};
      } catch (e) {
        return {};
      }
    },
    save: function (p) {
      try { window.localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) { /* 忽略 */ }
    }
  };

  // 第一次打开时放入的 2 条虚构示例（一条标红、一条标橙）
  function makeSamples() {
    var today = todayStr();
    var now = new Date().toISOString();
    return [
      {
        id: newId(),
        title: '基于多源遥感数据的城市热岛效应时空演变分析',
        sourceType: 'elsevier',
        venue: '示例期刊 A',
        manuscriptId: 'DEMO-2026-001',
        submittedDate: addDays(today, -95),
        status: 'under_review',
        statusChangedDate: addDays(today, -80),
        note: '这是一条示例数据，可以直接删除。\n它已经等待超过 90 天，所以天数标成了红色，提醒你该发邮件问问进度了。',
        isSample: true,
        createdAt: now,
        updatedAt: now
      },
      {
        id: newId(),
        title: '面向边缘设备的轻量化目标检测网络设计',
        sourceType: 'ieee',
        venue: '示例期刊 B',
        manuscriptId: '',
        submittedDate: addDays(today, -45),
        status: 'major_revision',
        statusChangedDate: addDays(today, -5),
        note: '这是一条示例数据，可以直接删除。\n等待 31–90 天时天数标成橙色；稿号没填时会显示「未填写」。',
        isSample: true,
        createdAt: now,
        updatedAt: now
      }
    ];
  }

  // 整理一条记录：补齐缺失字段、修正类型；保留未知字段，避免丢掉以后版本新增的数据
  function normalizePaper(p) {
    if (!p || typeof p !== 'object' || Array.isArray(p)) return null;
    function str(v) { return typeof v === 'string' ? v : (v == null ? '' : String(v)); }
    var now = new Date().toISOString();
    var out = Object.assign({}, p);
    out.id = str(p.id);
    out.title = str(p.title);
    out.sourceType = SOURCES.some(function (s) { return s.id === p.sourceType; }) ? p.sourceType : 'other';
    out.venue = str(p.venue);
    out.manuscriptId = str(p.manuscriptId);
    out.submittedDate = str(p.submittedDate);
    out.status = str(p.status) || 'submitted';
    out.statusChangedDate = str(p.statusChangedDate);
    out.note = str(p.note);
    out.isSample = p.isSample === true;
    out.createdAt = str(p.createdAt) || now;
    out.updatedAt = str(p.updatedAt) || now;
    return out;
  }

  // 整理论文列表：去掉无效条目，修复重复或缺失的编号
  function normalizePapers(list) {
    var seen = {};
    var papers = [];
    (Array.isArray(list) ? list : []).forEach(function (item) {
      var p = normalizePaper(item);
      if (!p) return;
      if (!p.id || seen[p.id]) p.id = newId();
      seen[p.id] = true;
      papers.push(p);
    });
    return papers;
  }

  function emptyData() {
    return { schemaVersion: SCHEMA_VERSION, seeded: true, papers: [], customStatuses: [] };
  }

  // 从 localStorage 读取最新数据（版本 1 的数据会自动升级到版本 2）
  function loadData() {
    if (!store.available) return state.data || emptyData();

    var raw = store.readRaw();
    if (raw === null) {
      // 第一次打开：放入示例数据
      var fresh = emptyData();
      fresh.papers = makeSamples();
      if (!store.write(fresh)) showStorageUnavailable();
      return fresh;
    }

    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.papers)) {
      return handleCorrupt(raw);
    }

    var data = Object.assign({}, parsed);
    data.schemaVersion = Math.max(SCHEMA_VERSION, typeof parsed.schemaVersion === 'number' ? parsed.schemaVersion : 0);
    data.seeded = true;
    data.papers = normalizePapers(parsed.papers);
    data.customStatuses = normalizeCustomStatuses(parsed.customStatuses);
    return data;
  }

  // 数据损坏：先另存原始内容，再从空列表开始；另存失败则不覆盖，只在内存里运行
  function handleCorrupt(raw) {
    var backupKey = store.backup(raw);
    var data = emptyData();
    if (backupKey && store.write(data)) {
      // 备份键名写进控制台，方便以后排查或手动恢复
      console.warn('投稿状态总览：无法读取的原始数据已备份到 localStorage 键「' + backupKey + '」');
      showBanner('corrupt', '本地数据无法读取，原始内容已另存为备份（不会删除），列表从空开始。');
    } else {
      store.available = false;
      showBanner('corrupt', '本地数据无法读取，且无法另存备份。为避免覆盖原数据，本次打开期间的修改不会保存。');
    }
    return data;
  }

  // 修改数据的唯一入口：先读最新数据（避免覆盖其他标签页的修改），再修改、保存、刷新列表
  function commit(mutator) {
    var data = loadData();
    var result = mutator(data);
    if (result === false) {           // 修改函数表示无需保存
      state.data = data;
      render();
      return { ok: true, changed: false };
    }
    if (store.available && !store.write(data)) {
      // 保存失败：界面回到已保存的状态，避免显示没存下来的内容
      state.data = loadData();
      render();
      showBanner('save-failed', '保存失败：浏览器存储空间已满或被禁止写入，刚才的修改没有生效。');
      return { ok: false, changed: false };
    }
    state.data = data;
    render();
    return { ok: true, changed: true };
  }

  /* =====================================================================
   * 七、页面状态与元素
   * ===================================================================== */
  var state = {
    data: null,
    visible: [],           // 当前筛选、排序后显示的论文
    filters: { q: '', status: '', source: '' },
    sort: 'submitted_desc',
    expanded: {},          // 已展开的卡片编号
    renderedDay: '',       // 上次渲染时的日期，跨天后自动重算天数
    editingId: null,       // 正在编辑的论文编号，null 表示新增
    editingOriginal: null, // 编辑前的论文
    editingStatusId: null, // 正在编辑的自定义状态编号
    pendingRestore: null   // 已读取、等待确认的备份
  };

  function $(id) { return document.getElementById(id); }

  var els = {
    list: $('paper-list'),
    empty: $('empty-state'),
    noMatch: $('no-match'),
    banners: $('banners'),
    toast: $('toast'),
    addBtn: $('btn-add'),
    // 工具栏
    toolbar: $('toolbar'),
    search: $('search'),
    searchClear: $('search-clear'),
    filterBtn: $('btn-filter'),
    filterCount: $('filter-count'),
    filterPanel: $('filter-panel'),
    filterStatus: $('filter-status'),
    filterSource: $('filter-source'),
    sortSelect: $('sort-select'),
    resultBar: $('result-bar'),
    resultText: $('result-text'),
    // 更多菜单
    moreBtn: $('btn-more'),
    menu: $('more-menu'),
    backupCount: $('backup-count'),
    restoreFile: $('restore-file'),
    // 添加 / 编辑
    dialog: $('paper-dialog'),
    dialogTitle: $('paper-dialog-title'),
    form: $('paper-form'),
    title: $('f-title'),
    sourceGroup: $('f-source-group'),
    venue: $('f-venue'),
    manuscriptId: $('f-manuscriptId'),
    submittedDate: $('f-submittedDate'),
    status: $('f-status'),
    changedField: $('changed-date-field'),
    changedDate: $('f-statusChangedDate'),
    note: $('f-note'),
    // 恢复
    restoreDialog: $('restore-dialog'),
    restoreForm: $('restore-form'),
    restoreFileInfo: $('restore-file-info'),
    restoreSummary: $('restore-summary'),
    overwriteDesc: $('overwrite-desc'),
    // 管理状态
    statusDialog: $('status-dialog'),
    presetChips: $('preset-chips'),
    customList: $('custom-list'),
    statusListError: $('status-list-error'),
    statusListOk: $('status-list-ok'),
    newStatusBtn: $('btn-new-status'),
    statusEditor: $('status-editor'),
    statusEditorTitle: $('status-editor-title'),
    sName: $('s-name'),
    sSwatches: $('s-swatches'),
    sFinal: $('s-final'),
    sFinalHint: $('s-final-hint'),

    confirm: $('confirm-dialog'),
    confirmTitle: $('confirm-title'),
    confirmMsg: $('confirm-message'),
    confirmOk: $('confirm-ok'),
    confirmCancel: $('confirm-cancel')
  };

  var ALL_DIALOGS = [els.dialog, els.restoreDialog, els.statusDialog, els.confirm];

  /* =====================================================================
   * 八、提示条与轻提示
   * ===================================================================== */
  var bannerNodes = {};

  function showBanner(key, text) {
    var node = bannerNodes[key];
    if (!node) {
      node = el('div', 'banner');
      var p = el('p');
      var close = el('button', 'btn btn-text', '知道了');
      close.type = 'button';
      close.addEventListener('click', function () {
        node.remove();
        delete bannerNodes[key];
      });
      node.append(p, close);
      els.banners.append(node);
      bannerNodes[key] = node;
    }
    node.querySelector('p').textContent = text;
  }

  function hideBanner(key) {
    if (!bannerNodes[key]) return;
    bannerNodes[key].remove();
    delete bannerNodes[key];
  }

  function showStorageUnavailable() {
    showBanner('storage', '当前浏览器不允许保存数据（可能开启了无痕/隐私模式，或禁用了网站数据），录入的内容在刷新或关闭页面后会丢失。');
  }

  var toastTimer = null;
  function showToast(text) {
    els.toast.textContent = text;
    els.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.hidden = true; }, 2600);
  }

  /* =====================================================================
   * 九、搜索、筛选、排序
   * ===================================================================== */
  var searchCache = new WeakMap();   // 论文对象 → 用于搜索的文字

  function searchTextOf(p) {
    var t = searchCache.get(p);
    if (t === undefined) {
      t = normalizeText(p.title + '\n' + p.venue + '\n' + p.manuscriptId);
      searchCache.set(p, t);
    }
    return t;
  }

  function searchTerms() {
    return normalizeText(state.filters.q).split(/\s+/).filter(Boolean);
  }

  function filtersActive() {
    var f = state.filters;
    return !!(f.q.trim() || f.status || f.source);
  }

  // 多个关键词（空格分隔）需要同时匹配；按字面查找，输入 ( * 等符号也不会出错
  function makeMatcher() {
    var f = state.filters;
    var terms = searchTerms();
    return function (p) {
      if (f.status && p.status !== f.status) return false;
      if (f.source && p.sourceType !== f.source) return false;
      if (terms.length) {
        var hay = searchTextOf(p);
        for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1) return false;
      }
      return true;
    };
  }

  // 默认排序：投稿日期从新到旧；同一天按添加时间从新到旧
  function compareSubmittedDesc(a, b) {
    if (a.submittedDate !== b.submittedDate) return a.submittedDate < b.submittedDate ? 1 : -1;
    if (a.createdAt !== b.createdAt) return a.createdAt < b.createdAt ? 1 : -1;
    return 0;
  }

  function sortPapers(list, sortId, today) {
    if (sortId === 'submitted_asc') {
      return list.sort(function (a, b) {
        var va = parseYMD(a.submittedDate) !== null, vb = parseYMD(b.submittedDate) !== null;
        if (va !== vb) return va ? -1 : 1;   // 日期无效的排最后
        if (a.submittedDate !== b.submittedDate) return a.submittedDate < b.submittedDate ? -1 : 1;
        if (a.createdAt !== b.createdAt) return a.createdAt < b.createdAt ? -1 : 1;
        return 0;
      });
    }
    if (sortId === 'wait_desc' || sortId === 'wait_asc') {
      // 分组：0 = 还在等待；1 = 已出结果（排在后面）；2 = 日期无效（排最后）
      var keys = new Map();
      list.forEach(function (p) {
        var w = getWaitInfo(p, today);
        keys.set(p, { group: w.days === null ? 2 : (w.level === 'final' ? 1 : 0), days: w.days || 0 });
      });
      var dir = sortId === 'wait_desc' ? -1 : 1;
      return list.sort(function (a, b) {
        var ka = keys.get(a), kb = keys.get(b);
        if (ka.group !== kb.group) return ka.group - kb.group;
        if (ka.days !== kb.days) return (ka.days - kb.days) * dir;
        return compareSubmittedDesc(a, b);
      });
    }
    return list.sort(compareSubmittedDesc);
  }

  function resetFilters() {
    state.filters = { q: '', status: '', source: '' };
    els.search.value = '';
  }

  var filterOptionsSig = '';
  function syncToolbar() {
    // 自定义状态有变化时才重建筛选下拉，避免打断正在进行的选择
    var sig = JSON.stringify(customStatuses());
    if (sig !== filterOptionsSig) {
      filterOptionsSig = sig;
      fillStatusOptions(els.filterStatus, '', true);
    }
    if (state.filters.status && !statusIndex[state.filters.status]) state.filters.status = '';
    els.filterStatus.value = state.filters.status;
    els.filterSource.value = state.filters.source;
    els.sortSelect.value = state.sort;
    if (els.search.value !== state.filters.q) els.search.value = state.filters.q;
    els.searchClear.hidden = !state.filters.q;

    var n = (state.filters.status ? 1 : 0) + (state.filters.source ? 1 : 0);
    els.filterCount.hidden = n === 0;
    els.filterCount.textContent = String(n);
    els.filterBtn.setAttribute('aria-label', n ? '筛选（已设置 ' + n + ' 个条件）' : '筛选');
  }

  /* =====================================================================
   * 十、渲染列表
   * ===================================================================== */
  var cardCache = {};   // 论文编号 → { sig, node }，内容没变的卡片直接复用，500 条时筛选也不卡
  var detailsSeq = 0;

  function cardSig(p, ctx) {
    return JSON.stringify([p.title, p.sourceType, p.venue, p.manuscriptId, p.submittedDate, p.status,
      p.statusChangedDate, p.note, p.isSample, p.createdAt]) + ctx;
  }

  function render() {
    var today = todayStr();
    state.renderedDay = today;
    rebuildStatusIndex();

    var all = state.data.papers;
    if (all.length === 0 && filtersActive()) resetFilters();   // 列表清空后不保留筛选条件
    syncToolbar();

    var visible = sortPapers(all.filter(makeMatcher()), state.sort, today);
    state.visible = visible;

    var ctx = '|' + today + '|' + filterOptionsSig;
    var alive = {};
    all.forEach(function (p) { alive[p.id] = true; });
    Object.keys(cardCache).forEach(function (id) { if (!alive[id]) delete cardCache[id]; });

    var frag = document.createDocumentFragment();
    visible.forEach(function (p) {
      var sig = cardSig(p, ctx);
      var cached = cardCache[p.id];
      if (!cached || cached.sig !== sig) {
        cached = { sig: sig, node: renderCard(p, today) };
        cardCache[p.id] = cached;
      } else {
        // 复用的卡片：下拉框的值以数据为准（例如保存失败时要回到原状态）
        cached.node.querySelector('select.status-select').value = p.status;
      }
      frag.append(cached.node);
    });
    els.list.textContent = '';
    els.list.append(frag);

    var hasAny = all.length > 0;
    els.toolbar.hidden = !hasAny;
    els.empty.hidden = hasAny;
    els.noMatch.hidden = !hasAny || visible.length > 0;
    els.list.hidden = visible.length === 0;
    els.resultBar.hidden = !hasAny || !filtersActive();
    els.resultText.textContent = '显示 ' + visible.length + ' / ' + all.length + ' 篇';
    updateMenuCounts();
  }

  function renderCard(p, today) {
    var st = getStatus(p.status);
    var wait = getWaitInfo(p, today);
    var expanded = !!state.expanded[p.id];
    var detailsId = 'details-' + (++detailsSeq);

    var li = el('li', 'paper-card' + (expanded ? ' expanded' : ''));
    li.dataset.id = p.id;

    // 第 1 行：标题（最多 2 行，点击展开）+ 示例标签
    var top = el('div', 'card-top');
    var titleBtn = el('button', 'title-btn');
    titleBtn.type = 'button';
    titleBtn.dataset.action = 'toggle';
    titleBtn.setAttribute('aria-expanded', String(expanded));
    titleBtn.setAttribute('aria-controls', detailsId);
    titleBtn.append(el('span', 'title-text', p.title || '（未填写标题）'));
    top.append(titleBtn);
    if (p.isSample) top.append(el('span', 'tag-sample', '示例'));

    // 第 2 行：来源 · 期刊/会议名 · 稿号
    var meta = el('div', 'card-meta');
    meta.append(
      el('span', 'source-pill', sourceName(p.sourceType)),
      el('span', 'meta-item' + (p.venue ? '' : ' is-empty'), p.venue || '期刊/会议：未填写'),
      el('span', 'meta-item' + (p.manuscriptId ? '' : ' is-empty'), '稿号：' + (p.manuscriptId || '未填写'))
    );

    // 第 3 行：状态（快捷下拉）· 等待天数 · 投稿日期 · 操作
    var row = el('div', 'card-status');
    var wrap = el('span', 'status-wrap');
    setStatusVars(wrap, st);
    var select = el('select', 'status-select');
    select.dataset.action = 'status';
    select.setAttribute('aria-label', '修改状态');
    fillStatusOptions(select, p.status, false);
    wrap.append(select);

    var days = el('span', 'days days-' + wait.level);
    var icon = makeDaysIcon(wait.level);
    if (icon) days.append(icon);
    days.append(document.createTextNode(wait.text));
    days.title = wait.tip;

    var submitted = el('span', 'submitted', '投稿于 ' + (p.submittedDate || '未填写'));

    var actions = el('span', 'card-actions');
    var editBtn = el('button', 'btn btn-text', '编辑');
    editBtn.type = 'button';
    editBtn.dataset.action = 'edit';
    var delBtn = el('button', 'btn btn-text is-danger', '删除');
    delBtn.type = 'button';
    delBtn.dataset.action = 'delete';
    actions.append(editBtn, delBtn);

    var rowBreak = el('span', 'row-break');
    rowBreak.setAttribute('aria-hidden', 'true');
    row.append(wrap, days, rowBreak, submitted, actions);

    // 展开后的详情：备注、状态变更日期、添加日期
    var details = el('div', 'card-details');
    details.id = detailsId;
    details.hidden = !expanded;
    var dl = el('dl');
    dl.append(el('dt', null, '备注'));
    var noteDd = el('dd');
    noteDd.append(p.note ? el('span', 'note-text', p.note) : el('span', 'note-empty', '无'));
    dl.append(noteDd);
    dl.append(el('dt', null, '状态变更'), el('dd', null, p.statusChangedDate || '未记录'));
    dl.append(el('dt', null, '添加于'), el('dd', null, localDateOf(p.createdAt) || '未记录'));
    details.append(dl);

    li.append(top, meta, row, details);

  }

  // 等待天数徽章前的小图标：橙色档用时钟，红色档用感叹号，其他档不加
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function makeDaysIcon(level) {
    if (level !== 'warn' && level !== 'danger') return null;
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'days-icon');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.8');
    svg.setAttribute('stroke-linecap', 'round');
    var circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', '8');
    circle.setAttribute('cy', '8');
    circle.setAttribute('r', '6.2');
    var path = document.createElementNS(SVG_NS, 'path');
    // 时钟指针 / 感叹号
    path.setAttribute('d', level === 'warn' ? 'M8 4.6V8l2.3 1.5' : 'M8 4.4v4.2M8 11.3v.2');
    svg.append(circle, path);
    return svg;
  }

  // 展开 / 收起卡片（不重绘整个列表）
  function toggleCard(card) {
    var id = card.dataset.id;
    var expanded = !state.expanded[id];
    if (expanded) state.expanded[id] = true; else delete state.expanded[id];
    card.classList.toggle('expanded', expanded);
    card.querySelector('.title-btn').setAttribute('aria-expanded', String(expanded));
    card.querySelector('.card-details').hidden = !expanded;

  // 新增或修改后的论文如果被当前筛选条件隐藏，在提示里说一声
  function hiddenNote(id) {
    var shown = state.visible.some(function (p) { return p.id === id; });
    return shown ? '' : '（当前筛选条件下不显示）';
  }

  /* =====================================================================
   * 十一、弹窗与确认
   * ===================================================================== */
  function openDialog(dialog) {
    if (typeof dialog.showModal === 'function') {
      if (!dialog.open) dialog.showModal();
    } else {
      dialog.setAttribute('open', '');
    }
    document.body.classList.add('modal-open');
  }

  function closeDialog(dialog) {
    if (typeof dialog.close === 'function') {
      if (dialog.open) dialog.close();
    } else {
      dialog.removeAttribute('open');
    }
  }

  ALL_DIALOGS.forEach(function (d) {
    d.addEventListener('close', function () {
      var anyOpen = ALL_DIALOGS.some(function (x) { return x.open; });
      if (!anyOpen) document.body.classList.remove('modal-open');
    });
    d.querySelectorAll('[data-close]').forEach(function (btn) {
      btn.addEventListener('click', function () { closeDialog(d); });
    });
  });

  // 通用确认框，返回 Promise<是否确认>
  var confirmResolver = null;
  function askConfirm(opts) {
    if (confirmResolver) settleConfirm(false);
    els.confirmTitle.textContent = opts.title;
    els.confirmMsg.textContent = opts.message || '';
    els.confirmOk.textContent = opts.okText || '确定';
    els.confirmOk.className = 'btn ' + (opts.danger === false ? 'btn-primary' : 'btn-danger');
    openDialog(els.confirm);
    els.confirmCancel.focus();
    return new Promise(function (resolve) { confirmResolver = resolve; });
  }

  function settleConfirm(result) {
    var resolve = confirmResolver;
    confirmResolver = null;
    closeDialog(els.confirm);
    if (resolve) resolve(result);
  }

  els.confirmOk.addEventListener('click', function () { settleConfirm(true); });
  els.confirmCancel.addEventListener('click', function () { settleConfirm(false); });
  // 按 Esc 关闭 = 取消
  els.confirm.addEventListener('close', function () { if (confirmResolver) settleConfirm(false); });
  // 点击确认框外的遮罩 = 取消
  els.confirm.addEventListener('click', function (e) {
    if (e.target === els.confirm) settleConfirm(false);
  });

  /* =====================================================================
   * 十二、列表上的操作：展开、改状态、编辑、删除
   * ===================================================================== */
  function findPaper(id) {
    for (var i = 0; i < state.data.papers.length; i++) {
      if (state.data.papers[i].id === id) return state.data.papers[i];
    }

  els.list.addEventListener('click', function (e) {

    if (!card) return;
    var actionEl = e.target.closest('[data-action]');
    var action = actionEl ? actionEl.dataset.action : null;

    if (action === 'edit') return openForm(card.dataset.id);
    if (action === 'delete') return askDelete(card.dataset.id);
    if (action === 'status') return;
    if (action === 'toggle') return toggleCard(card);

    // 点卡片空白处也能展开；在详情区域里点击、或正在选中文字时不切换
    if (e.target.closest('button, select, a, input, textarea, .card-details')) return;
    var sel = window.getSelection ? window.getSelection().toString() : '';
    if (sel) return;
    toggleCard(card);
  });

  els.list.addEventListener('change', function (e) {
    var select = e.target.closest('select[data-action="status"]');
    if (!select) return;
    var id = select.closest('.paper-card').dataset.id;
    changeStatus(id, select.value);

  // 快捷改状态：立即保存，状态变更日期记为今天
  function changeStatus(id, newStatus) {
    var today = todayStr();
    var missing = false;
    var result = commit(function (data) {
      var p = null;
      data.papers.forEach(function (x) { if (x.id === id) p = x; });
      if (!p) { missing = true; return false; }
      if (p.status === newStatus) return false;
      p.status = newStatus;
      p.statusChangedDate = today;
      p.updatedAt = new Date().toISOString();
    });
    if (missing) showToast('这条记录已在其他页面被删除');
    else if (result.changed) showToast('已改为「' + getStatus(newStatus).name + '」' + hiddenNote(id));
  }

  function askDelete(id) {
    var p = findPaper(id);
    if (!p) return;
    askConfirm({
      title: '删除这篇论文？',
      message: '《' + truncate(p.title || '未填写标题', 60) + '》删除后无法恢复。',
      okText: '删除'
    }).then(function (ok) {
      if (!ok) return;
      var result = commit(function (data) {
        var before = data.papers.length;
        data.papers = data.papers.filter(function (x) { return x.id !== id; });
        if (data.papers.length === before) return false;

      if (result.ok) showToast('已删除');

  /* =====================================================================

  SOURCES.forEach(function (s) {

    input.name = 'sourceType';
    input.value = s.id;
    label.append(input, el('span', null, s.name));
    els.sourceGroup.append(label);

  var FIELD_ORDER = ['title', 'sourceType', 'submittedDate', 'status', 'statusChangedDate'];

  function setError(field, message) {
    var box = els.form.querySelector('[data-field="' + field + '"]');
    var msg = $('e-' + field);
    if (box) box.classList.toggle('invalid', !!message);
    if (msg) msg.textContent = message || '';
    var input = field === 'sourceType' ? null : els[field === 'statusChangedDate' ? 'changedDate' : field];
    if (input) {
      if (message) {
        input.setAttribute('aria-invalid', 'true');
        input.setAttribute('aria-describedby', 'e-' + field);
      } else {
        input.removeAttribute('aria-invalid');
      }
    }
  }

  function clearErrors() {
    FIELD_ORDER.forEach(function (f) { setError(f, ''); });
  }

  function getSelectedSource() {
    var checked = els.sourceGroup.querySelector('input:checked');
    return checked ? checked.value : '';
  }

  // 只有选了「已出结果」类的状态才显示出结果日期
  function syncChangedDateField() {
    var status = els.status.value;
    var isFinal = getStatus(status).final;
    els.changedField.hidden = !isFinal;
    if (!isFinal) {
      setError('statusChangedDate', '');
      return;
    }
    var orig = state.editingOriginal;
    if (orig && orig.status === status && orig.statusChangedDate) {
      els.changedDate.value = orig.statusChangedDate;  // 状态没变，恢复原来的日期
    } else {
      els.changedDate.value = todayStr();               // 新的结果，默认今天
    }
  }

  function openForm(id) {
    var today = todayStr();
    var p = id ? findPaper(id) : null;
    if (id && !p) return;

    state.editingId = p ? p.id : null;
    state.editingOriginal = p ? Object.assign({}, p) : null;
    els.dialogTitle.textContent = p ? '编辑论文' : '添加论文';
    els.form.reset();
    clearErrors();

    // 日期输入框最多只能选到今天
    els.submittedDate.max = today;
    els.submittedDate.min = MIN_DATE;
    els.changedDate.max = today;
    els.changedDate.min = MIN_DATE;

    fillStatusOptions(els.status, p ? p.status : 'submitted', false);
    if (p) {
      els.title.value = p.title;
      var radios = els.sourceGroup.querySelectorAll('input');
      for (var i = 0; i < radios.length; i++) radios[i].checked = radios[i].value === p.sourceType;
      els.venue.value = p.venue;
      els.manuscriptId.value = p.manuscriptId;
      els.submittedDate.value = p.submittedDate;
      els.note.value = p.note;
    }
    syncChangedDateField();

    openDialog(els.dialog);
    els.dialog.querySelector('.dialog-body').scrollTop = 0;

  els.status.addEventListener('change', syncChangedDateField);

  // 读取并整理表单内容
  function readForm() {
    return {
      title: els.title.value.replace(/[\r\n]+/g, ' ').trim(),   // 标题不允许换行
      sourceType: getSelectedSource(),
      venue: els.venue.value.trim(),
      manuscriptId: els.manuscriptId.value.trim(),
      submittedDate: els.submittedDate.value,
      status: els.status.value,
      statusChangedDate: els.changedDate.value,
      note: els.note.value.replace(/^\s+|\s+$/g, '')
    };
  }

  // 校验，返回 { 字段名: 错误信息 }
  function validate(v) {
    var errors = {};
    var today = todayStr();

    if (!v.title) errors.title = '请填写论文标题';
    if (!v.sourceType) errors.sourceType = '请选择来源类型';

    if (els.submittedDate.validity && els.submittedDate.validity.badInput) {
      errors.submittedDate = '投稿日期没有填完整';
    } else if (!v.submittedDate) {
      errors.submittedDate = '请选择投稿日期';
    } else if (parseYMD(v.submittedDate) === null) {
      errors.submittedDate = '日期格式不正确，请重新选择';
    } else if (v.submittedDate > today) {
      errors.submittedDate = '投稿日期不能晚于今天（' + today + '）';
    } else if (v.submittedDate < MIN_DATE) {
      errors.submittedDate = '投稿日期不能早于 ' + MIN_DATE + '，请检查年份';
    }

    var orig = state.editingOriginal;
    if (!statusIndex[v.status] && !(orig && orig.status === v.status)) {
      errors.status = '请选择当前状态';
    }

    if (getStatus(v.status).final) {
      if (els.changedDate.validity && els.changedDate.validity.badInput) {
        errors.statusChangedDate = '出结果日期没有填完整';
      } else if (!v.statusChangedDate) {
        errors.statusChangedDate = '请选择出结果日期';
      } else if (parseYMD(v.statusChangedDate) === null) {
        errors.statusChangedDate = '日期格式不正确，请重新选择';
      } else if (v.statusChangedDate > today) {
        errors.statusChangedDate = '出结果日期不能晚于今天（' + today + '）';
      } else if (!errors.submittedDate && v.statusChangedDate < v.submittedDate) {
        errors.statusChangedDate = '出结果日期不能早于投稿日期';
      }
    }
    return errors;
  }

  // 算出要保存的状态变更日期
  function resolveChangedDate(v) {
    var today = todayStr();
    if (getStatus(v.status).final) return v.statusChangedDate;
    var orig = state.editingOriginal;
    if (orig && orig.status === v.status && parseYMD(orig.statusChangedDate) !== null) {
      // 状态没变：沿用原日期，但不能早于投稿日期
      return orig.statusChangedDate < v.submittedDate ? v.submittedDate : orig.statusChangedDate;
    }
    // 新增且状态为「已投稿」：状态变更日期就是投稿日期
    if (!orig && v.status === 'submitted') return v.submittedDate;
    return today;
  }

  els.form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = readForm();
    var errors = validate(v);
    clearErrors();
    var first = null;
    FIELD_ORDER.forEach(function (f) {
      if (errors[f]) {
        setError(f, errors[f]);
        if (!first) first = f;
      }
    });
    if (first) {
      var focusMap = {
        title: els.title,
        sourceType: els.sourceGroup.querySelector('input'),
        submittedDate: els.submittedDate,
        status: els.status,
        statusChangedDate: els.changedDate
      };
      focusMap[first].focus();
      return;
    }

    var editingId = state.editingId;
    var targetId = editingId || newId();
    var changedDate = resolveChangedDate(v);
    var now = new Date().toISOString();
    var missing = false;

    var result = commit(function (data) {
      if (editingId) {
        var p = null;
        data.papers.forEach(function (x) { if (x.id === editingId) p = x; });
        if (!p) { missing = true; return false; }
        p.title = v.title;
        p.sourceType = v.sourceType;
        p.venue = v.venue;
        p.manuscriptId = v.manuscriptId;
        p.submittedDate = v.submittedDate;
        p.status = v.status;
        p.statusChangedDate = changedDate;
        p.note = v.note;
        p.updatedAt = now;
      } else {
        data.papers.push({
          id: targetId,
          title: v.title,
          sourceType: v.sourceType,
          venue: v.venue,
          manuscriptId: v.manuscriptId,
          submittedDate: v.submittedDate,
          status: v.status,
          statusChangedDate: changedDate,
          note: v.note,
          isSample: false,
          createdAt: now,
          updatedAt: now
        });
      }
    });

    if (missing) {
      closeDialog(els.dialog);
      showToast('这条记录已在其他页面被删除，没有保存');
      return;
    }
    if (!result.ok) return;   // 保存失败时保留弹窗，内容不丢
    closeDialog(els.dialog);
    showToast((editingId ? '已保存修改' : '已添加') + hiddenNote(targetId));
  });

  [els.form, els.statusEditor].forEach(function (f) {

  /* =====================================================================
   * 十五、更多菜单
   * ===================================================================== */
  function menuItems() {
    return Array.prototype.slice.call(els.menu.querySelectorAll('.menu-item'));
  }

  function updateMenuCounts() {
    var n = state.visible.length;
    var total = state.data.papers.length;
    els.menu.querySelectorAll('[data-export-count]').forEach(function (span) {
      span.textContent = n ? '当前列表 ' + n + ' 篇' : '当前列表为空';
      span.parentNode.disabled = n === 0;
    });

  function openMenu() {
    updateMenuCounts();
    els.menu.hidden = false;
    els.moreBtn.setAttribute('aria-expanded', 'true');
    var first = menuItems().filter(function (b) { return !b.disabled; })[0];
    if (first) first.focus();
  }

  function closeMenu(focusButton) {
    if (els.menu.hidden) return;
    els.menu.hidden = true;
    els.moreBtn.setAttribute('aria-expanded', 'false');
    if (focusButton) els.moreBtn.focus();
  }

  els.moreBtn.addEventListener('click', function () {
    if (els.menu.hidden) openMenu(); else closeMenu(false);
  });

  document.addEventListener('click', function (e) {
    if (!els.menu.hidden && !e.target.closest('.menu-wrap')) closeMenu(false);
  });

  els.menu.addEventListener('keydown', function (e) {
    var items = menuItems().filter(function (b) { return !b.disabled; });
    var idx = items.indexOf(document.activeElement);
    if (e.key === 'Escape') {
      e.preventDefault();
      closeMenu(true);
    } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var step = e.key === 'ArrowDown' ? 1 : -1;
      var next = items[(idx + step + items.length) % items.length];
      if (next) next.focus();
    } else if (e.key === 'Tab') {
      closeMenu(false);
    }
  });

  els.menu.addEventListener('click', function (e) {
    var item = e.target.closest('.menu-item');
    if (!item || item.disabled) return;
    closeMenu(false);
    var action = item.dataset.menu;
    if (action === 'export-xlsx') exportXlsx();
    else if (action === 'export-csv') exportCsv();
    else if (action === 'backup') downloadBackup();
    else if (action === 'restore') {

      els.restoreFile.click();
    } else if (action === 'statuses') openStatusDialog();
  });

  /* =====================================================================
   * 十六、导出：Excel / CSV / 备份
   * ===================================================================== */
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  function exportFileBase() {
    return '投稿状态总览_' + todayStr() + (filtersActive() ? '_筛选结果' : '');
  }

  // 把论文整理成导出用的行
  function exportRows(papers) {
    var today = todayStr();
    return papers.map(function (p) {
      var st = getStatus(p.status);
      var w = getWaitInfo(p, today);
      return {
        title: p.title,
        source: sourceName(p.sourceType),
        venue: p.venue,
        manuscriptId: p.manuscriptId,
        submittedDate: p.submittedDate,
        statusName: statusLabel(p.status),
        days: (w.days !== null && w.days >= 0) ? w.days : null,
        daysText: w.text,
        level: w.level,
        final: st.final ? '是' : '否',
        changed: p.statusChangedDate,
        note: p.note
      };
    });
  }

  // ---------- CSV ----------
  // 以 = + - @ 开头的文字前加单引号，防止在表格软件里被当成公式执行
  function csvCell(value) {
    var s = value == null ? '' : String(value);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    if (/[",\r\n]/.test(s) || /^\s|\s$/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function buildCsv(rows) {
    var lines = [EXPORT_HEADERS.map(csvCell).join(',')];
    rows.forEach(function (r) {
      lines.push([
        csvCell(r.title), csvCell(r.source), csvCell(r.venue), csvCell(r.manuscriptId),
        csvCell(r.submittedDate), csvCell(r.statusName),
        r.days !== null ? String(r.days) : csvCell(r.daysText),
        csvCell(r.final), csvCell(r.changed), csvCell(r.note)
      ].join(','));
    });
    // 开头加 BOM，Windows 上用 Excel 打开中文不乱码
    return '\uFEFF' + lines.join('\r\n') + '\r\n';
  }

  function exportCsv() {
    var rows = exportRows(state.visible);
    if (!rows.length) return;
    downloadBlob(new Blob([buildCsv(rows)], { type: 'text/csv;charset=utf-8' }), exportFileBase() + '.csv');
    showToast('已导出 ' + rows.length + ' 篇（CSV）');

  // ---------- Excel（.xlsx，由页面自己生成，不依赖外部库） ----------
  // 去掉 XML 不允许的控制字符和不成对的代理字符（emoji 这类成对的保留）
  var XML_SUSPECT = /[\u0000-\u0008\u000B\u000C\u000E-\u001F\uD800-\uDFFF\uFFFE\uFFFF]/;
  function stripInvalidXml(s) {
    if (!XML_SUSPECT.test(s)) return s;
    var out = '';
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c >= 0xD800 && c <= 0xDBFF) {
        var next = s.charCodeAt(i + 1);
        if (next >= 0xDC00 && next <= 0xDFFF) { out += s.charAt(i) + s.charAt(i + 1); i++; }
        continue;
      }
      if (c >= 0xDC00 && c <= 0xDFFF) continue;
      if ((c < 0x20 && c !== 0x09 && c !== 0x0A && c !== 0x0D) || c === 0xFFFE || c === 0xFFFF) continue;
      out += s.charAt(i);
    }
    return out;
  }

  function xmlEscape(value) {
    return stripInvalidXml(String(value))
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  var XLSX_MAX_CELL = 32767;   // Excel 单元格最多 32767 个字符

  function xStr(ref, value, style) {
    if (value == null || value === '') return '';
    var s = String(value);
    if (s.length > XLSX_MAX_CELL) s = s.slice(0, XLSX_MAX_CELL);
    return '<c r="' + ref + '" t="inlineStr" s="' + style + '"><is><t xml:space="preserve">' + xmlEscape(s) + '</t></is></c>';
  }

  function xNum(ref, n, style) {
    return '<c r="' + ref + '" s="' + style + '"><v>' + n + '</v></c>';
  }

  // 日期写成 Excel 能排序的真正日期；无效日期按文字写入
  var EXCEL_EPOCH = Date.UTC(1899, 11, 30);
  function xDate(ref, ymd) {
    var t = parseYMD(ymd);
    if (t === null) return xStr(ref, ymd, 2);
    return xNum(ref, Math.round((t - EXCEL_EPOCH) / DAY_MS), 4);
  }

  var XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

  var XLSX_STYLES = XML_HEAD +
    '<styleSheet xmlns="' + NS_MAIN + '">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy-mm-dd"/></numFmts>' +
    '<fonts count="4">' +

    '<font><b/><sz val="11"/><name val="等线"/><family val="2"/><charset val="134"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FF2B1600"/><name val="等线"/><family val="2"/><charset val="134"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="等线"/><family val="2"/><charset val="134"/></font>' +
    '</fonts>' +
    '<fills count="5">' +
    '<fill><patternFill patternType="none"/></fill>' +

    '<fill><patternFill patternType="solid"><fgColor rgb="FFD0312D"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="2">' +
    '<border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><left/><right/><top/><bottom style="thin"><color rgb="FFCDD2DA"/></bottom><diagonal/></border>' +
    '</borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="8">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="left" vertical="top"/></xf>' +
    '<xf numFmtId="1" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>' +
    '<xf numFmtId="1" fontId="2" fillId="3" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>' +
    '<xf numFmtId="1" fontId="3" fillId="4" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  function buildXlsxFiles(rows) {
    var cols = 'ABCDEFGHIJ';
    var last = rows.length + 1;
    var ref = 'A1:J' + last;
    var out = [];

    out.push('<row r="1" ht="22" customHeight="1">' +
      EXPORT_HEADERS.map(function (h, i) { return xStr(cols[i] + '1', h, 1); }).join('') + '</row>');
    rows.forEach(function (r, i) {
      var n = i + 2;
      var dayStyle = r.level === 'warn' ? 6 : (r.level === 'danger' ? 7 : 5);
      out.push('<row r="' + n + '">' +
        xStr('A' + n, r.title, 3) +
        xStr('B' + n, r.source, 2) +
        xStr('C' + n, r.venue, 3) +
        xStr('D' + n, r.manuscriptId, 2) +
        xDate('E' + n, r.submittedDate) +
        xStr('F' + n, r.statusName, 2) +
        (r.days !== null ? xNum('G' + n, r.days, dayStyle) : xStr('G' + n, r.daysText, 2)) +
        xStr('H' + n, r.final, 2) +
        xDate('I' + n, r.changed) +
        xStr('J' + n, r.note, 3) +
        '</row>');
    });

    var sheet = XML_HEAD +
      '<worksheet xmlns="' + NS_MAIN + '" xmlns:r="' + NS_REL + '">' +
      '<dimension ref="' + ref + '"/>' +
      '<sheetViews><sheetView workbookViewId="0" tabSelected="1">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '<selection pane="bottomLeft" activeCell="A2" sqref="A2"/>' +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="15"/>' +
      '<cols>' + COL_WIDTHS.map(function (w, i) {
        return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
      }).join('') + '</cols>' +
      '<sheetData>' + out.join('') + '</sheetData>' +
      '<autoFilter ref="' + ref + '"/>' +
      '<pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/>' +
      '</worksheet>';

    var workbook = XML_HEAD +
      '<workbook xmlns="' + NS_MAIN + '" xmlns:r="' + NS_REL + '">' +
      '<bookViews><workbookView/></bookViews>' +
      '<sheets><sheet name="' + SHEET_NAME + '" sheetId="1" r:id="rId1"/></sheets>' +
      '<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">\'' +
      SHEET_NAME + '\'!$A$1:$J$' + last + '</definedName></definedNames>' +
      '</workbook>';

    return [
      { name: '[Content_Types].xml', data: XML_HEAD +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        '</Types>' },
      { name: '_rels/.rels', data: XML_HEAD +
        '<Relationships xmlns="' + NS_PKG_REL + '">' +
        '<Relationship Id="rId1" Type="' + NS_REL + '/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>' },
      { name: 'xl/workbook.xml', data: workbook },
      { name: 'xl/_rels/workbook.xml.rels', data: XML_HEAD +
        '<Relationships xmlns="' + NS_PKG_REL + '">' +
        '<Relationship Id="rId1" Type="' + NS_REL + '/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="' + NS_REL + '/styles" Target="styles.xml"/>' +
        '</Relationships>' },
