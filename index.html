  // ---------- 最简 ZIP 打包（不压缩），.xlsx 本质上是一个 ZIP ----------
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(files, mime) {
    var enc = new TextEncoder();
    var parts = [];
    var central = [];
    var offset = 0;
    var d = new Date();
    var dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
    var dosDate = ((Math.max(d.getFullYear(), 1980) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

    files.forEach(function (f) {
      var name = enc.encode(f.name);
      var data = enc.encode(f.data);
      var crc = crc32(data);

      var lh = new DataView(new ArrayBuffer(30));   // 本地文件头
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);                // 文件名用 UTF-8
      lh.setUint16(8, 0, true);                     // 不压缩
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true);
      lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);

      var ch = new DataView(new ArrayBuffer(46));   // 中央目录记录
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true);
      ch.setUint32(20, data.length, true);
      ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true);
      ch.setUint16(30, 0, true);
      ch.setUint16(32, 0, true);
      ch.setUint16(34, 0, true);
      ch.setUint16(36, 0, true);
      ch.setUint32(38, 0, true);
      ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);

      offset += 30 + name.length + data.length;
    });

    var cdSize = central.reduce(function (s, a) { return s + a.length; }, 0);
    var end = new DataView(new ArrayBuffer(22));      // 中央目录结束记录
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(4, 0, true);
    end.setUint16(6, 0, true);
    end.setUint16(8, files.length, true);
    end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    end.setUint16(20, 0, true);

    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: mime });
  }

  function exportXlsx() {
    var rows = exportRows(state.visible);
    if (!rows.length) return;
    var blob = makeZip(buildXlsxFiles(rows), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    downloadBlob(blob, exportFileBase() + '.xlsx');
    showToast('已导出 ' + rows.length + ' 篇（Excel）');
  }

  // ---------- 备份（全部数据） ----------
  function backupBlob(data) {
    var payload = {
      app: APP_ID,
      type: 'backup',
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      papers: data.papers,
      customStatuses: data.customStatuses
    };
    return new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  }

  function downloadBackup(prefix) {
    var data = loadData();
    downloadBlob(backupBlob(data), (prefix || '投稿备份_') + todayStr() + '.json');
    if (!prefix) showToast('已备份 ' + data.papers.length + ' 篇论文');
  }

  /* =====================================================================
   * 十七、从备份恢复
   * ===================================================================== */
  function parseBackup(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) {
      return { error: '无法读取这个文件：它不是有效的备份文件。' };
    }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj) || !Array.isArray(obj.papers)) {
      return { error: '这个文件不是本工具导出的备份，请选择「备份全部数据」生成的 .json 文件。' };
    }
    var papers = normalizePapers(obj.papers);
    var statuses = normalizeCustomStatuses(obj.customStatuses);
    if (!papers.length && !statuses.length) {
      return { error: '这个备份文件里没有任何论文。' };
    }
    return {
      papers: papers,
      customStatuses: statuses,
      exportedAt: typeof obj.exportedAt === 'string' ? localDateOf(obj.exportedAt) : ''
    };
  }

  function onlySamples(data) {
    return data.customStatuses.length === 0 && data.papers.every(function (p) { return p.isSample; });
  }

  els.restoreFile.addEventListener('change', function () {
    var file = els.restoreFile.files && els.restoreFile.files[0];
    els.restoreFile.value = '';
    if (!file) return;
    if (file.size > MAX_IMPORT_BYTES) {
      showBanner('restore', '备份文件太大（超过 5 MB），无法恢复。请确认选择的是本工具导出的备份文件。');
      return;
    }
    file.text().then(function (text) {
      var parsed = parseBackup(text);
      if (parsed.error) {
        showBanner('restore', parsed.error);
        return;
      }
      parsed.fileName = file.name;
      openRestoreDialog(parsed);
    }, function () {
      showBanner('restore', '读取文件失败，请重新选择。');
    });
  });

  function openRestoreDialog(backup) {
    hideBanner('restore');
    state.pendingRestore = backup;
    var current = loadData();
    var samplesOnly = onlySamples(current);

    els.restoreFileInfo.textContent = '文件：' + backup.fileName + (backup.exportedAt ? '（备份于 ' + backup.exportedAt + '）' : '');
    els.restoreSummary.textContent = '备份里有 ' + backup.papers.length + ' 篇论文' +
      (backup.customStatuses.length ? '、' + backup.customStatuses.length + ' 个自定义状态' : '') +
      '；当前有 ' + current.papers.length + ' 篇' +
      (current.papers.length && samplesOnly ? '（都是示例数据）' : '') + '。';
    els.overwriteDesc.textContent = samplesOnly
      ? '清空当前数据，换成备份里的内容。当前只有示例数据，建议选这一项。'
      : '清空当前数据，换成备份里的内容。覆盖前会自动下载一份当前数据的备份。';
    var mode = samplesOnly ? 'overwrite' : 'merge';
    els.restoreForm.querySelector('input[value="' + mode + '"]').checked = true;
    openDialog(els.restoreDialog);
  }

  els.restoreForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var backup = state.pendingRestore;
    if (!backup) return;
    var mode = els.restoreForm.querySelector('input[name="restoreMode"]:checked').value;
    if (mode === 'merge') {
      closeDialog(els.restoreDialog);
      doMerge(backup);
      return;
    }
    var current = loadData();
    if (onlySamples(current)) {
      closeDialog(els.restoreDialog);
      doOverwrite(backup);
      return;
    }
    askConfirm({
      title: '用备份覆盖当前数据？',
      message: '当前的 ' + current.papers.length + ' 篇论文' +
        (current.customStatuses.length ? '和 ' + current.customStatuses.length + ' 个自定义状态' : '') +
        '会被替换。覆盖前会先自动下载一份当前数据的备份。',
      okText: '下载备份并覆盖'
    }).then(function (ok) {
      if (!ok) return;
      downloadBackup('投稿备份_覆盖前_');
      closeDialog(els.restoreDialog);
      doOverwrite(backup);
    });
  });

  function cloneList(list) { return JSON.parse(JSON.stringify(list)); }

  function afterRestore() {
    state.pendingRestore = null;
    state.expanded = {};
    resetFilters();
    render();
  }

  function doOverwrite(backup) {
    var result = commit(function (data) {
      data.papers = cloneList(backup.papers);
      data.customStatuses = cloneList(backup.customStatuses);
      data.seeded = true;
    });
    afterRestore();
    if (result.ok) showToast('已用备份覆盖，共 ' + backup.papers.length + ' 篇');
  }

  function paperKey(p) {
    return p.title && p.submittedDate ? nameKey(p.title) + '|' + p.submittedDate : '';
  }

  function doMerge(backup) {
    var stats = { added: 0, updated: 0, skipped: 0, statuses: 0 };
    var result = commit(function (data) {
      // 1. 合并自定义状态：同编号保留现有设置；同名的并到现有状态
      var idMap = {};
      var byId = {};
      var byName = {};
      data.customStatuses.forEach(function (s) { byId[s.id] = s; byName[nameKey(s.name)] = s; });
      cloneList(backup.customStatuses).forEach(function (s) {
        var k = nameKey(s.name);
        if (byId[s.id]) { idMap[s.id] = s.id; return; }
        if (byName[k]) { idMap[s.id] = byName[k].id; return; }
        idMap[s.id] = s.id;
        if (data.customStatuses.length >= MAX_CUSTOM) return;   // 超过上限：这些论文会显示为未知状态
        data.customStatuses.push(s);
        byId[s.id] = s;
        byName[k] = s;
        stats.statuses++;
      });

      // 2. 合并论文：同编号、或标题和投稿日期都相同的，视为同一篇，保留最后修改较新的版本
      var byPid = {};
      var byKey = {};
      data.papers.forEach(function (p, i) {
        byPid[p.id] = i;
        var k = paperKey(p);
        if (k && byKey[k] === undefined) byKey[k] = i;
      });
      cloneList(backup.papers).forEach(function (p) {
        if (idMap[p.status]) p.status = idMap[p.status];
        var k = paperKey(p);
        var idx = byPid[p.id];
        if (idx === undefined && k) idx = byKey[k];
        if (idx === undefined) {
          data.papers.push(p);
          byPid[p.id] = data.papers.length - 1;
          if (k && byKey[k] === undefined) byKey[k] = data.papers.length - 1;
          stats.added++;
          return;
        }
        var cur = data.papers[idx];
        if ((p.updatedAt || '') > (cur.updatedAt || '')) {
          p.id = cur.id;
          data.papers[idx] = p;
          stats.updated++;
        } else {
          stats.skipped++;
        }
      });
      if (!stats.added && !stats.updated && !stats.statuses) return false;
    });
    afterRestore();
    if (!result.ok) return;
    if (!result.changed) {
      showToast('备份里的内容都已存在，没有变化');
      return;
    }
    var parts = ['新增 ' + stats.added + ' 篇', '更新 ' + stats.updated + ' 篇'];
    if (stats.skipped) parts.push('跳过 ' + stats.skipped + ' 篇（已是最新）');
    if (stats.statuses) parts.push('新增 ' + stats.statuses + ' 个状态');
    showToast('已合并：' + parts.join('，'));
  }

  /* =====================================================================
   * 十八、管理自定义状态
   * ===================================================================== */
  // 生成颜色选项
  PALETTE.forEach(function (c, i) {
    var label = el('label', 'swatch');
    label.title = c.name;
    var input = document.createElement('input');
    input.type = 'radio';
    input.name = 'statusColor';
    input.value = c.color;
    input.setAttribute('aria-label', c.name);
    var span = el('span');
    span.style.setProperty('--c', c.color);
    label.append(input, span);
    els.sSwatches.append(label);
  });

  function usageCount(statusId) {
    return state.data.papers.filter(function (p) { return p.status === statusId; }).length;
  }

  function makeChip(st) {
    var chip = el('span', 'status-chip', st.name);
    setStatusVars(chip, st);
    return chip;
  }

  function setStatusMessage(error, ok) {
    els.statusListError.textContent = error || '';
    els.statusListOk.textContent = ok || '';
  }

  function renderStatusDialog() {
    rebuildStatusIndex();
    els.presetChips.textContent = '';
    PRESET_STATUSES.forEach(function (s) { els.presetChips.append(makeChip(s)); });

    els.customList.textContent = '';
    var customs = customStatuses();
    if (!customs.length) {
      els.customList.append(el('li', 'custom-empty', '还没有自定义状态'));
    }
    customs.forEach(function (s) {
      var st = statusIndex[s.id];
      var li = el('li', 'custom-row');
      li.dataset.id = s.id;
      li.append(makeChip(st));
      if (st.final) li.append(el('span', 'tag-final', '已出结果'));
      var n = usageCount(s.id);
      li.append(el('span', 'row-meta', n ? '使用中 ' + n + ' 篇' : '未使用'));
      var actions = el('span', 'row-actions');
      var edit = el('button', 'btn btn-text', '编辑');
      edit.type = 'button';
      edit.dataset.saction = 'edit';
      var del = el('button', 'btn btn-text is-danger', '删除');
      del.type = 'button';
      del.dataset.saction = 'delete';
      actions.append(edit, del);
      li.append(actions);
      els.customList.append(li);
    });

    var full = customs.length >= MAX_CUSTOM;
    els.newStatusBtn.disabled = full;
    els.newStatusBtn.textContent = full ? '已达到 ' + MAX_CUSTOM + ' 个上限' : '＋ 新增状态';
  }

  function openStatusDialog() {
    setStatusMessage('', '');
    hideStatusEditor();
    renderStatusDialog();
    openDialog(els.statusDialog);
  }

  function hideStatusEditor() {
    state.editingStatusId = null;
    els.statusEditor.hidden = true;
    els.newStatusBtn.hidden = false;
  }

  function setNameError(message) {
    $('e-s-name').textContent = message || '';
    els.statusEditor.querySelector('[data-sfield="name"]').classList.toggle('invalid', !!message);
    if (message) els.sName.setAttribute('aria-invalid', 'true'); else els.sName.removeAttribute('aria-invalid');
  }

  function openStatusEditor(id) {
    var s = null;
    customStatuses().forEach(function (x) { if (x.id === id) s = x; });
    if (id && !s) return;
    state.editingStatusId = s ? s.id : null;
    setStatusMessage('', '');
    setNameError('');
    els.statusEditorTitle.textContent = s ? '编辑状态' : '新增状态';
    els.sName.value = s ? s.name : '';
    els.sFinal.checked = s ? s.final : false;

    // 颜色：编辑时用原颜色；新增时优先选还没被用过的颜色
    var color = s ? s.color : null;
    if (!color) {
      var used = {};
      customStatuses().forEach(function (x) { used[x.color] = true; });
      var free = PALETTE.filter(function (c) { return !used[c.color]; })[0];
      color = (free || PALETTE[0]).color;
    }
    els.sSwatches.querySelectorAll('input').forEach(function (r) { r.checked = r.value === color; });

    var n = s ? usageCount(s.id) : 0;
    els.sFinalHint.hidden = n === 0;
    els.sFinalHint.textContent = n ? '有 ' + n + ' 篇论文在用这个状态，修改后会按新设置显示和计算天数。' : '';

    els.statusEditor.hidden = false;
    els.newStatusBtn.hidden = true;
    els.sName.focus();
    els.statusEditor.scrollIntoView({ block: 'nearest' });
  }

  function validateStatusName(name, selfId) {
    if (!name) return '请填写状态名称';
    if (Array.from(name).length > MAX_STATUS_NAME) return '名称最多 ' + MAX_STATUS_NAME + ' 个字';
    var k = nameKey(name);
    if (k === nameKey(UNKNOWN_STATUS.name)) return '「' + UNKNOWN_STATUS.name + '」是保留名称，请换一个';
    var list = PRESET_STATUSES.concat(customStatuses());
    for (var i = 0; i < list.length; i++) {
      if (list[i].id !== selfId && nameKey(list[i].name) === k) return '已经有叫「' + list[i].name + '」的状态了';
    }
    return '';
  }

  els.newStatusBtn.addEventListener('click', function () { openStatusEditor(null); });
  els.sCancel.addEventListener('click', function () {
    hideStatusEditor();
    els.newStatusBtn.focus();
  });

  els.statusEditor.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = els.sName.value.trim();
    var selfId = state.editingStatusId;
    var err = validateStatusName(name, selfId);
    if (err) {
      setNameError(err);
      els.sName.focus();
      return;
    }
    setNameError('');
    var checkedColor = els.sSwatches.querySelector('input:checked');
    var color = checkedColor ? checkedColor.value : PALETTE[0].color;
    var isFinal = els.sFinal.checked;
    var missing = false;
    var full = false;

    var result = commit(function (data) {
      if (selfId) {
        var s = null;
        data.customStatuses.forEach(function (x) { if (x.id === selfId) s = x; });
        if (!s) { missing = true; return false; }
        s.name = name;
        s.color = color;
        s.final = isFinal;
      } else {
        if (data.customStatuses.length >= MAX_CUSTOM) { full = true; return false; }
        data.customStatuses.push({ id: 'c_' + newId(), name: name, color: color, final: isFinal });
      }
    });

    hideStatusEditor();
    renderStatusDialog();
    if (missing) setStatusMessage('这个状态已在其他页面被删除。', '');
    else if (full) setStatusMessage('自定义状态最多 ' + MAX_CUSTOM + ' 个。', '');
    else if (result.ok) setStatusMessage('', '已保存「' + name + '」');
    els.newStatusBtn.focus();
  });

  els.customList.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-saction]');
    if (!btn) return;
    var id = btn.closest('.custom-row').dataset.id;
    if (btn.dataset.saction === 'edit') {
      openStatusEditor(id);
      return;
    }
    var st = statusIndex[id];
    if (!st) return;
    var n = usageCount(id);
    if (n > 0) {
      setStatusMessage('「' + st.name + '」正在被 ' + n + ' 篇论文使用，请先把这些论文改成其他状态，再删除。', '');
      return;
    }
    setStatusMessage('', '');
    askConfirm({ title: '删除状态「' + st.name + '」？', message: '删除后无法恢复。', okText: '删除' }).then(function (ok) {
      if (!ok) return;
      var blocked = 0;
      var result = commit(function (data) {
        // 保存前再确认一次没有论文在用（可能在其他页面刚改过）
        blocked = data.papers.filter(function (p) { return p.status === id; }).length;
        if (blocked) return false;
        var before = data.customStatuses.length;
        data.customStatuses = data.customStatuses.filter(function (x) { return x.id !== id; });
        if (data.customStatuses.length === before) return false;
      });
      if (state.editingStatusId === id) hideStatusEditor();
      renderStatusDialog();
      if (blocked) setStatusMessage('「' + st.name + '」正在被 ' + blocked + ' 篇论文使用，请先把这些论文改成其他状态，再删除。', '');
      else if (result.ok) setStatusMessage('', '已删除「' + st.name + '」');
    });
  });

  /* =====================================================================
   * 十九、跨标签页同步与跨天刷新
   * ===================================================================== */
  window.addEventListener('storage', function (e) {
    if (e.key !== null && e.key !== STORAGE_KEY) return;
    state.data = loadData();
    render();
    if (els.statusDialog.open) renderStatusDialog();
  });

  function refreshIfNewDay() {
    if (state.renderedDay !== todayStr()) render();
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshIfNewDay();
  });
  setInterval(refreshIfNewDay, 60000);

  /* =====================================================================
   * 二十、启动
   * ===================================================================== */
  var savedSort = prefs.load().sort;
  if (SORTS.some(function (s) { return s.id === savedSort; })) state.sort = savedSort;

  store.init();
  if (!store.available) {
    state.data = emptyData();
    state.data.papers = makeSamples();
    showStorageUnavailable();
  } else {
    state.data = loadData();
  }
  render();
})();
</script>
</body>
</html>
